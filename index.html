<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Título Principal do Aplicativo -->
    <title>SemPila - Controle Financeiro Pessoal</title>
    <meta name="description" content="SemPila - Controle financeiro mensal pessoal, minimalista e 100% offline." />
    
    <!-- Configurações PWA e Instalação na Tela de Início (Android e Web) -->
    <meta name="application-name" content="SemPila" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#09090b" />
    <meta name="msapplication-navbutton-color" content="#09090b" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Configurações para iPhone e iPad (iOS Safari "Adicionar à Tela de Início") -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="SemPila" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon.png" />

    <!-- Favicons e Ícones do Navegador -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />

    <!-- OpenGraph (WhatsApp, Telegram, Compartilhamentos Sociais) -->
    <meta property="og:site_name" content="SemPila" />
    <meta property="og:title" content="SemPila - Controle Financeiro Pessoal" />
    <meta property="og:description" content="SemPila - Controle financeiro mensal pessoal, minimalista e 100% offline." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SemPila - Controle Financeiro Pessoal" />
    <meta name="twitter:description" content="SemPila - Controle financeiro mensal pessoal, minimalista e 100% offline." />
    <meta name="twitter:image" content="/pwa-512x512.png" />

    <!-- Fontes Google Fonts (Plus Jakarta Sans + Unbounded para números/display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
